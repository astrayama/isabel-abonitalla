<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- White outline (draw first so pink sits on top) -->
  <line x1="16" y1="2"  x2="16" y2="13" stroke="white" stroke-width="3" stroke-linecap="square"/>
  <line x1="16" y1="19" x2="16" y2="30" stroke="white" stroke-width="3" stroke-linecap="square"/>
  <line x1="2"  y1="16" x2="13" y2="16" stroke="white" stroke-width="3" stroke-linecap="square"/>
  <line x1="19" y1="16" x2="30" y2="16" stroke="white" stroke-width="3" stroke-linecap="square"/>
  <circle cx="16" cy="16" r="3.5" fill="none" stroke="white" stroke-width="3"/>
  <!-- Pink fill on top -->
  <line x1="16" y1="2"  x2="16" y2="13" stroke="#F9A8D4" stroke-width="1.5" stroke-linecap="square"/>
  <line x1="16" y1="19" x2="16" y2="30" stroke="#F9A8D4" stroke-width="1.5" stroke-linecap="square"/>
  <line x1="2"  y1="16" x2="13" y2="16" stroke="#F9A8D4" stroke-width="1.5" stroke-linecap="square"/>
  <line x1="19" y1="16" x2="30" y2="16" stroke="#F9A8D4" stroke-width="1.5" stroke-linecap="square"/>
  <circle cx="16" cy="16" r="3.5" fill="none" stroke="#F9A8D4" stroke-width="1.5"/>
  <!-- Center pixel -->
  <rect x="15" y="15" width="2" height="2" fill="#F9A8D4"/>
</svg>
